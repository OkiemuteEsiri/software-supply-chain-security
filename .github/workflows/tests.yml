name: Security Engineering Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic assessment
        run: |
          python -m src.analyzer data/synthetic-supply-chain.json || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 1 ]; then exit "${code}"; fi
